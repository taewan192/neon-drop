plugins { id 'com.android.application' }
android {
    namespace 'com.arcana.neondrop'
    compileSdk 36
    defaultConfig {
        applicationId 'com.arcana.neondrop'
        minSdk 26
        targetSdk 36
        versionCode 9
        versionName '1.0.8'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('NEON_KEYSTORE'))
            storePassword System.getenv('NEON_STORE_PASSWORD')
            keyAlias 'neondrop-upload'
            keyPassword System.getenv('NEON_KEY_PASSWORD')
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

